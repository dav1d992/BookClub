name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main # Runs on every push/merge to main

# Prevent overlapping deploys if you push several times quickly.
# Do NOT cancel in progress: an interrupted FTP upload can leave the site
# in a broken/partial state. Let runs queue instead.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (production)
        run: yarn build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Angular build output (browser files) -> see angular.json outputPath
          local-dir: ./dist/book-club/
          # IMPORTANT: this must be the document root of your subdomain on Hostinger.
          # Adjust to match your file manager path. Everything under this folder that
          # is NOT in local-dir will be DELETED, so make sure it is correct.
          server-dir: ./public_html/02-subdomain-book-club/dist/
