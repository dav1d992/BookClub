name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main # Runs on every push/merge to main

# Prevent overlapping deploys if you push several times quickly.
# Do NOT cancel in progress: an interrupted FTP upload can leave the site
# in a broken/partial state. Let runs queue instead.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (production)
        run: yarn build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Angular build output (browser files) -> see angular.json outputPath
          local-dir: ./dist/book-club/
          # VERIFIED served document root (absolute path from the FTP account home).
          # NOTE: the account's `public_html` is a symlink to a DIFFERENT domain
          # (dav1d992.com), so we must target the lokeytech.com folder explicitly.
          # Confirmed by direct FTP upload -> https://bogklub.lokeytech.com/.
          # Everything under this folder that is NOT in local-dir will be DELETED.
          server-dir: /domains/lokeytech.com/public_html/02-subdomain-book-club/dist/book-club/
